# Labels for core/config/plugin.plane.settings.yml, merged into the Settings page.
url:
  label: Plane address
  info: 'The site the dashboard reads work items from: https://<name>.ddev.site for one the builder made, or your own. No trailing slash.'
token:
  label: API key
  info: 'An API key of the account the dashboard reads (and, with writes on, writes) as: Profile settings → Personal Access Tokens → Add personal access token. It reads plane_api_ and 32 hex digits. Never printed.'
allow_writes:
  label: Writes to Plane (work items)
  info: 'Off: the AI works on a branch and nothing leaves this machine. On: you may comment, move a work item to another state, label it and assign it, each a click after a preview, each a line in actions.log. The Community Edition has no worklog, so there is no "Log work".'
  options:
    "false": "Off — nothing is written to Plane (default)"
    "true": "On — each write is your click after a preview"
max_agents:
  label: Author sessions at once
  info: 'How many AI sessions may work work items at the same time. Each is a whole session in a project.'
  number: { min: 1, max: 8, step: 1 }
default_scope:
  label: Default Plane project
  info: 'The workspace''s slug and the project''s identifier, as webship/WEB: the Plane project a workspace project works against when it remembers none.'
scopes:
  label: Plane projects the list may switch to
  info: 'A list of slug/IDENTIFIER. Empty is any project of the default project''s workspace. Edit it in the Raw YAML tab.'
work_in:
  label: Where the AI works
  info: 'A new branch in the project (a running site shows the change), or a git worktree outside the workspace folders (the project stays as it is).'
  options:
    branch: "A branch in the project (default)"
    worktree: "A worktree outside the workspace folders"
sandbox:
  label: Sandbox for the author session
  info: 'Required: Claude Code''s sandboxed Bash (no network, credentials denied), and no session without it. On Ubuntu 24.04 bubblewrap needs its AppArmor profile (see the tracker''s README). Off: your choice, said in the form.'
  options:
    required: "Required (default)"
    "off": "Off — the session is not sandboxed"
network_domains:
  label: Domains the sandbox allows
  info: 'The package registries the project needs (registry.npmjs.org, repo.packagist.org…). None by default. Edit it in the Raw YAML tab.'
allow_web:
  label: Web tools in the author session
  info: 'WebFetch and WebSearch. Off by default: a link in a work item is not opened.'
  options:
    "false": "Off (default)"
    "true": "On"
comments_from:
  label: Comments the AI reads
  info: 'Members: only comments by Admins and Members of the project (default). All, or none.'
  options:
    members: "Admins and Members (default)"
    all: "All comments"
    none: "No comments"
outsider_items:
  label: Work items from outside the project
  info: 'Opened, or last edited, by a Guest or someone with no membership. Analyze: analyze only, unless you tick a confirmation that names them. Refuse: analyze only.'
  options:
    analyze: "Analyze only, unless confirmed by name (default)"
    refuse: "Analyze only"
