# Plane — core/config/plugin.plane.settings.yml
#
# The Plane the dashboard reads work items from: a site the builder made (https://<name>.ddev.site), or your own
# (Community Edition or a paid one). The token is an API key of an account there (Profile settings → Personal Access
# Tokens). Never printed.
# The Plane address, without a trailing slash.
url: CHANGE_ME
# An API key of the account the dashboard reads (and, with writes on, writes) as: plane_api_ and 32 hex digits.
token: CHANGE_ME
# The work items as work items (the tracker family). See @webship.co/workspace-tracker for every key.
# Writes to Plane: comments, moves to another state, labels, assignees, new work items. Off by default.
allow_writes: false
# Author sessions at once.
max_agents: 1
# The Plane project a workspace project works against when it remembers none: the workspace's slug and the project's identifier (webship/WEB).
default_scope: ""
# The Plane projects (slug/IDENTIFIER) the list may be switched to; empty is any project of the default scope's workspace.
scopes: []
# branch: a new branch in the project; worktree: a git worktree outside the workspace folders.
work_in: branch
# required: Claude Code's sandbox for the author session, and no session without it; off: a person's choice.
sandbox: required
# Domains the sandbox allows (the project's package registries).
network_domains: []
# WebFetch and WebSearch in the author session.
allow_web: false
# The comments a snapshot keeps: members (Admins and Members of the project), all, none.
comments_from: members
# A work item from outside the project (opened, or last edited, by a Guest or someone with no membership): analyze (work it only after a confirmation that names its author) or refuse.
outsider_items: analyze
